name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matlab-tests:
    name: Run labs and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run labs and tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('tests'); run_labs; results = runtests('tests'); disp(table(results)); assertSuccess(results);
